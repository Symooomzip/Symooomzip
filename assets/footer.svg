<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="A green hill under a blue sky with soft clouds">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7fd8"/>
      <stop offset="0.65" stop-color="#7fbdf0"/>
      <stop offset="1" stop-color="#c4e4fa"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6bb82e"/>
      <stop offset="0.55" stop-color="#3f9220"/>
      <stop offset="1" stop-color="#24691a"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9f3a"/>
      <stop offset="1" stop-color="#2f7d2a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="1200" height="220" fill="url(#sky)"/>
  <g fill="#ffffff" filter="url(#soft)" opacity="0.92">
    <ellipse cx="210" cy="62" rx="120" ry="20"/>
    <ellipse cx="290" cy="50" rx="80" ry="18"/>
    <ellipse cx="760" cy="40" rx="140" ry="17"/>
    <ellipse cx="850" cy="54" rx="90" ry="15"/>
    <ellipse cx="1040" cy="82" rx="110" ry="14"/>
    <ellipse cx="520" cy="86" rx="90" ry="11" opacity="0.7"/>
  </g>
  <path d="M0,138 C180,112 340,104 520,118 C700,132 860,100 1040,104 C1120,106 1170,112 1200,118 L1200,220 L0,220 Z" fill="url(#ridge)" opacity="0.75"/>
  <path d="M0,168 C200,138 420,120 660,134 C880,147 1050,146 1200,128 L1200,220 L0,220 Z" fill="url(#hill)"/>
  <path d="M0,168 C200,138 420,120 660,134 C880,147 1050,146 1200,128" fill="none" stroke="#9be05a" stroke-opacity="0.55" stroke-width="2"/>
</svg>
